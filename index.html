<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Production Log</title>
    <!-- Tailwind CSS for neat, professional styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; }
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Data Structure Definitions ---
        const GRADES = ['G1', 'G2', 'G3', 'G4'];
        const SUBJECTS = ['English 1 (E1, L1)', 'English 2 (E2, L2)', 'Maths', 'Science'];
        const TASK_TYPES = ['Audio/Images (Slides/Recap)', 'Quizzes', 'Games'];
        
        const STATUSES = {
            'To Do': { bg: 'bg-slate-100', text: 'text-slate-700', border: 'border-slate-200' },
            'In Progress': { bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-200' },
            'Done (Ready)': { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200' },
            'Uploaded': { bg: 'bg-indigo-50', text: 'text-indigo-700', border: 'border-indigo-200' }
        };

        // Generate the baseline tasks for a fresh week
        const generateInitialTasks = () => {
            let newTasks = [];
            let idCounter = 1;
            GRADES.forEach(grade => {
                SUBJECTS.forEach(subject => {
                    TASK_TYPES.forEach(task => {
                        // Skip Audio/Images and Quizzes for Grade 4 (Only keep Games)
                        if (grade === 'G4' && task !== 'Games') {
                            return; 
                        }

                        newTasks.push({
                            id: idCounter++,
                            grade,
                            subject,
                            task,
                            status: 'To Do',
                            notes: ''
                        });
                    });
                });
            });
            return newTasks;
        };

        const App = () => {
            // --- State Management ---
            const [currentWeek, setCurrentWeek] = useState(10);
            const [allWeeksData, setAllWeeksData] = useState({});
            const [filterGrade, setFilterGrade] = useState('All');
            const [isLoaded, setIsLoaded] = useState(false);

            // Cloud Sync States
            const [user, setUser] = useState(null);
            const [dbSetup, setDbSetup] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);
            const [syncError, setSyncError] = useState(null);

            // Cloud Sync: Initialize Firebase and load data
            useEffect(() => {
                let unsubscribe = null;

                const initCloudSync = async () => {
                    try {
                        // Dynamically import Firebase modules
                        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                        const { getAuth, signInAnonymously, signInWithCustomToken } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                        const { getFirestore, doc, setDoc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

                        // --- GITHUB HOSTING SETUP ---
                        // When you host this on GitHub, replace 'null' below with your actual Firebase config object.
                        // Example: const YOUR_FIREBASE_CONFIG = { apiKey: "...", projectId: "...", ... };
                        const YOUR_FIREBASE_CONFIG = null; 

                        const appId = typeof __app_id !== 'undefined' ? __app_id : 'standalone-tracker';
                        const firebaseConfig = YOUR_FIREBASE_CONFIG || (typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null);
                        
                        if (!firebaseConfig) {
                            throw new Error("No cloud config found. Falling back to local storage.");
                        }

                        const app = initializeApp(firebaseConfig);
                        const auth = getAuth(app);
                        const db = getFirestore(app);
                        
                        setDbSetup({ db, doc, setDoc });

                        // Authenticate securely
                        let currentUser;
                        if (typeof __initial_auth_token !== 'undefined') {
                            const cred = await signInWithCustomToken(auth, __initial_auth_token);
                            currentUser = cred.user;
                        } else {
                            const cred = await signInAnonymously(auth);
                            currentUser = cred.user;
                        }
                        setUser(currentUser);

                        // Load data from Cloud Database
                        // Path structure: /artifacts/{appId}/users/{userId}/{collectionName}/{documentName}
                        const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'tracker', 'log');
                        
                        unsubscribe = onSnapshot(docRef, (docSnap) => {
                            if (docSnap.exists() && docSnap.data().weeks) {
                                setAllWeeksData(docSnap.data().weeks);
                            }
                            setIsLoaded(true);
                            setSyncError(null);
                        }, (error) => {
                            console.error("Sync error:", error);
                            setSyncError("Cloud connection lost.");
                            setIsLoaded(true);
                        });

                    } catch (err) {
                        console.log("Using Local Storage:", err.message);
                        // Fallback to local storage if no cloud config is found (e.g., plain GitHub pages)
                        const savedData = localStorage.getItem('contentProductionLog');
                        if (savedData) setAllWeeksData(JSON.parse(savedData));
                        setIsLoaded(true);
                    }
                };

                initCloudSync();

                return () => {
                    if (unsubscribe) unsubscribe();
                };
            }, []);

            // Save data to Cloud (and LocalStorage as backup) whenever it changes
            useEffect(() => {
                if (!isLoaded) return;

                // Always save locally as a backup
                localStorage.setItem('contentProductionLog', JSON.stringify(allWeeksData));

                // Save to cloud if connected
                if (user && dbSetup) {
                    const saveToCloud = async () => {
                        setIsSyncing(true);
                        try {
                            const appId = typeof __app_id !== 'undefined' ? __app_id : 'standalone-tracker';
                            const docRef = dbSetup.doc(dbSetup.db, 'artifacts', appId, 'users', user.uid, 'tracker', 'log');
                            await dbSetup.setDoc(docRef, { weeks: allWeeksData }, { merge: true });
                            setSyncError(null);
                        } catch (err) {
                            console.error("Failed to save to cloud", err);
                            setSyncError("Failed to save.");
                        } finally {
                            setIsSyncing(false);
                        }
                    };

                    // Wait 800ms after you stop typing to save to the cloud to save database writes
                    const debounce = setTimeout(saveToCloud, 800);
                    return () => clearTimeout(debounce);
                }
            }, [allWeeksData, isLoaded, user, dbSetup]);

            // Get current tasks, or initialize if week is empty
            const currentTasks = useMemo(() => {
                if (!isLoaded) return [];
                if (allWeeksData[currentWeek]) {
                    return allWeeksData[currentWeek];
                }
                return generateInitialTasks();
            }, [allWeeksData, currentWeek, isLoaded]);

            // Ensure the current week is properly initialized in state if it's new
            useEffect(() => {
                if (isLoaded && !allWeeksData[currentWeek]) {
                    setAllWeeksData(prev => ({
                        ...prev,
                        [currentWeek]: generateInitialTasks()
                    }));
                }
            }, [currentWeek, isLoaded, allWeeksData]);

            // --- Handlers ---
            const updateTask = (taskId, field, value) => {
                setAllWeeksData(prev => {
                    const updatedWeek = prev[currentWeek].map(task => 
                        task.id === taskId ? { ...task, [field]: value } : task
                    );
                    return { ...prev, [currentWeek]: updatedWeek };
                });
            };

            const exportToCSV = () => {
                const headers = ['Grade', 'Subject', 'Task', 'Status', 'Notes'];
                const rows = currentTasks.map(t => 
                    [
                        t.grade, 
                        `"${t.subject}"`, 
                        `"${t.task}"`, 
                        t.status, 
                        `"${t.notes.replace(/"/g, '""')}"` // Escape quotes in notes
                    ].join(',')
                );
                
                const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows].join('\n');
                const encodedUri = encodeURI(csvContent);
                
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Content_Production_Week_${currentWeek}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // --- Derived Metrics ---
            const filteredTasks = currentTasks.filter(t => filterGrade === 'All' || t.grade === filterGrade);
            const totalTasks = currentTasks.length;
            const completedUploads = currentTasks.filter(t => t.status === 'Uploaded').length;
            const inProgressTasks = currentTasks.filter(t => t.status === 'In Progress' || t.status === 'Done (Ready)').length;
            const progressPercentage = totalTasks > 0 ? Math.round((completedUploads / totalTasks) * 100) : 0;

            if (!isLoaded) return null;

            return (
                <div className="min-h-screen bg-slate-50 p-4 md:p-8">
                    <div className="max-w-7xl mx-auto space-y-6">
                        
                        {/* Header & Controls */}
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <div className="flex items-center gap-3">
                                    <h1 className="text-2xl font-bold text-slate-800">Weekly Content Log</h1>
                                    
                                    {/* Cloud Sync Status Indicator */}
                                    {user && (
                                        <span className="flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full bg-slate-50 text-slate-600 border border-slate-200 shadow-sm">
                                            <span className={`w-2 h-2 rounded-full ${syncError ? 'bg-red-500' : isSyncing ? 'bg-amber-400 animate-pulse' : 'bg-emerald-500'}`}></span>
                                            {syncError ? 'Sync Error' : isSyncing ? 'Saving...' : 'Cloud Synced'}
                                        </span>
                                    )}
                                    {!user && isLoaded && (
                                        <span className="flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full bg-slate-50 text-slate-500 border border-slate-200 shadow-sm" title="Data is saving to this browser only">
                                            <span className="w-2 h-2 rounded-full bg-slate-400"></span>
                                            Local Mode
                                        </span>
                                    )}
                                </div>
                                <p className="text-sm text-slate-500 mt-1">Track and manage your asset creation and uploads.</p>
                            </div>
                            
                            <div className="flex items-center gap-4 w-full md:w-auto">
                                <div className="flex items-center gap-2 bg-slate-100 p-1.5 rounded-lg border border-slate-200">
                                    <button 
                                        onClick={() => setCurrentWeek(prev => Math.max(1, prev - 1))}
                                        className="px-3 py-1 bg-white shadow-sm rounded text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-colors font-medium text-sm"
                                    >
                                        &larr; Prev
                                    </button>
                                    <span className="font-semibold text-slate-700 px-3 py-1 flex items-center gap-2">
                                        Week 
                                        <input 
                                            type="number" 
                                            value={currentWeek} 
                                            onChange={(e) => setCurrentWeek(parseInt(e.target.value) || 1)}
                                            className="w-16 text-center border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                                            min="1"
                                        />
                                    </span>
                                    <button 
                                        onClick={() => setCurrentWeek(prev => prev + 1)}
                                        className="px-3 py-1 bg-white shadow-sm rounded text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-colors font-medium text-sm"
                                    >
                                        Next &rarr;
                                    </button>
                                </div>
                                <button 
                                    onClick={exportToCSV}
                                    className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-lg font-medium transition-colors shadow-sm text-sm ml-auto"
                                    title="Download as Spreadsheet file"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                                    Export to CSV
                                </button>
                            </div>
                        </div>

                        {/* Dashboard Stats */}
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                                <p className="text-sm font-medium text-slate-500">Overall Progress</p>
                                <div className="mt-2 flex items-baseline gap-2">
                                    <span className="text-3xl font-bold text-slate-800">{progressPercentage}%</span>
                                    <span className="text-sm text-slate-500">Uploaded</span>
                                </div>
                                <div className="w-full bg-slate-100 h-2 rounded-full mt-3 overflow-hidden">
                                    <div className="bg-indigo-500 h-2 rounded-full transition-all duration-500" style={{width: `${progressPercentage}%`}}></div>
                                </div>
                            </div>
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                                <p className="text-sm font-medium text-slate-500">To Do</p>
                                <p className="text-3xl font-bold text-slate-800 mt-2">{currentTasks.filter(t => t.status === 'To Do').length}</p>
                            </div>
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                                <p className="text-sm font-medium text-slate-500">In Progress / Ready</p>
                                <p className="text-3xl font-bold text-blue-600 mt-2">{inProgressTasks}</p>
                            </div>
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                                <p className="text-sm font-medium text-slate-500">Fully Uploaded</p>
                                <p className="text-3xl font-bold text-indigo-600 mt-2">{completedUploads} / {totalTasks}</p>
                            </div>
                        </div>

                        {/* Main Tracker Container */}
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            {/* Filters */}
                            <div className="border-b border-slate-200 bg-slate-50/50 p-4">
                                <div className="flex flex-wrap gap-2">
                                    <span className="text-sm font-medium text-slate-500 flex items-center mr-2">Filter by Grade:</span>
                                    {['All', ...GRADES].map(grade => (
                                        <button
                                            key={grade}
                                            onClick={() => setFilterGrade(grade)}
                                            className={`px-4 py-1.5 rounded-full text-sm font-medium transition-colors ${
                                                filterGrade === grade 
                                                    ? 'bg-slate-800 text-white shadow-sm' 
                                                    : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'
                                            }`}
                                        >
                                            {grade}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Table */}
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider">
                                            <th className="p-4 font-semibold w-24">Grade</th>
                                            <th className="p-4 font-semibold w-48">Subject</th>
                                            <th className="p-4 font-semibold w-64">Task Type</th>
                                            <th className="p-4 font-semibold w-48">Status</th>
                                            <th className="p-4 font-semibold">Notes / Links</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {filteredTasks.map((task) => (
                                            <tr key={task.id} className="hover:bg-slate-50/50 transition-colors group">
                                                <td className="p-4">
                                                    <span className={`inline-flex items-center justify-center px-2.5 py-1 rounded text-xs font-bold border
                                                        ${task.grade === 'G1' ? 'bg-orange-50 text-orange-700 border-orange-200' : ''}
                                                        ${task.grade === 'G2' ? 'bg-pink-50 text-pink-700 border-pink-200' : ''}
                                                        ${task.grade === 'G3' ? 'bg-purple-50 text-purple-700 border-purple-200' : ''}
                                                        ${task.grade === 'G4' ? 'bg-cyan-50 text-cyan-700 border-cyan-200' : ''}
                                                    `}>
                                                        {task.grade}
                                                    </span>
                                                </td>
                                                <td className="p-4 font-medium text-slate-700 text-sm">{task.subject}</td>
                                                <td className="p-4 text-slate-600 text-sm flex items-center gap-2">
                                                    {task.task.includes('Audio') && <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>}
                                                    {task.task.includes('Quizzes') && <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>}
                                                    {task.task.includes('Games') && <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4"/><path d="M8 10v4"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/></svg>}
                                                    {task.task}
                                                </td>
                                                <td className="p-4">
                                                    <select
                                                        value={task.status}
                                                        onChange={(e) => updateTask(task.id, 'status', e.target.value)}
                                                        className={`w-full text-sm rounded-md px-3 py-1.5 border appearance-none cursor-pointer focus:outline-none focus:ring-2 focus:ring-slate-400 font-medium transition-colors
                                                            ${STATUSES[task.status].bg} ${STATUSES[task.status].text} ${STATUSES[task.status].border}
                                                        `}
                                                        style={{ backgroundImage: `url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e")`, backgroundPosition: `right 0.5rem center`, backgroundRepeat: `no-repeat`, backgroundSize: `1.5em 1.5em`, paddingRight: `2.5rem` }}
                                                    >
                                                        {Object.keys(STATUSES).map(status => (
                                                            <option key={status} value={status}>{status}</option>
                                                        ))}
                                                    </select>
                                                </td>
                                                <td className="p-4">
                                                    <input 
                                                        type="text"
                                                        value={task.notes}
                                                        onChange={(e) => updateTask(task.id, 'notes', e.target.value)}
                                                        placeholder="Add links, notes, or where you left off..."
                                                        className="w-full text-sm px-3 py-1.5 bg-transparent border border-transparent hover:border-slate-200 focus:border-blue-400 focus:bg-white rounded transition-all focus:outline-none focus:ring-2 focus:ring-blue-100 placeholder-slate-300 text-slate-700"
                                                    />
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                {filteredTasks.length === 0 && (
                                    <div className="p-8 text-center text-slate-500">
                                        No tasks found for this filter.
                                    </div>
                                )}
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
